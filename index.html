<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackfest3.0 — website under construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient canvas background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Glowing atmospheric orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>
  <div class="cyber-grid"></div>
  <div class="scanlines"></div>

  <!-- Main interactive container -->
  <main class="page-container">
    <div class="card-glow-wrapper" id="card-wrapper">
      <div class="glass-card">
        
        <!-- Main Brand Title: Only 'H' is capital in Hackfest3.0 -->
        <div class="brand-title">
          <span class="brand-h">H</span><span class="brand-ackfest">ackfest</span><span class="brand-version">3.0</span>
        </div>

        <!-- Cyber Laser Divider -->
        <div class="cyber-divider">
          <div class="divider-line"></div>
          <div class="divider-diamond"></div>
          <div class="divider-line"></div>
        </div>

        <!-- Primary Message: website under construction -->
        <h1 class="construction-message">website under construction</h1>

        <!-- High-tech Animated Construction Progress Bar -->
        <div class="progress-module">
          <div class="progress-bar-track">
            <div class="progress-bar-fill"></div>
            <div class="progress-laser"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
