<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E1A"/>
      <stop offset="50%" stop-color="#0E1513"/>
      <stop offset="100%" stop-color="#080A09"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C14B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2E933C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63E6D1" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#81C14B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#204E4A" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#81C14B" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#2E933C" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#080A09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="160" fill="url(#ambient)"/>

  <!-- Tech Hexagon / Halo Rings -->
  <circle cx="200" cy="165" r="95" fill="none" stroke="url(#accentRing)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="200" cy="165" r="108" fill="none" stroke="#81C14B" stroke-width="1" opacity="0.2"/>

  <!-- Minimalist Developer Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="54" fill="#182722" stroke="url(#avatarGlow)" stroke-width="2.5"/>
  
  <!-- Visor / Tech Glimmer -->
  <path d="M165 152 Q200 148 235 152 Q200 162 165 152 Z" fill="#63E6D1" opacity="0.85"/>
  <circle cx="185" cy="152" r="2.5" fill="#FFFFFF"/>
  <circle cx="215" cy="152" r="2.5" fill="#FFFFFF"/>

  <!-- Shoulders / Torso -->
  <path d="M110 320 C115 250, 150 230, 200 230 C250 230, 285 250, 290 320 Z" fill="#182722" stroke="url(#avatarGlow)" stroke-width="2.5"/>
  <path d="M150 232 L200 280 L250 232" fill="none" stroke="#81C14B" stroke-width="1.8" opacity="0.5"/>
  <line x1="200" y1="280" x2="200" y2="320" stroke="#81C14B" stroke-width="1.5" opacity="0.4"/>

  <!-- Tech Code Bracket Watermark in Background -->
  <text x="200" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#81C14B" letter-spacing="4" opacity="0.75">&lt; SDC TEAM MEMBER /&gt;</text>
</svg>
